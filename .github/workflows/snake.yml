name: snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2f6fed&color_dots=#ebedf0,#c6d8fb,#8fb2f7,#5a8cf2,#2f6fed
            dist/snake-dark.svg?palette=github-dark&color_snake=#5a8cf2&color_dots=#161b22,#1c2d50,#244a8f,#2f6fed,#5a8cf2

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
