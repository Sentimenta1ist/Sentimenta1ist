name: contribution-dots

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [scripts/dots.py, .github/workflows/dots.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/dots.py assets

      - name: Commit
        run: |
          git config user.name "Alexander Ivanenko"
          git config user.email "sentimental1243@gmail.com"
          git add assets/heatmap.svg
          git diff --cached --quiet || git commit -m "Update contribution dots"
          git push
