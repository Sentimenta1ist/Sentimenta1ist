name: neofetch-card

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [scripts/neofetch.py, assets/portrait.txt, .github/workflows/neofetch.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/neofetch.py assets

      - name: Commit
        run: |
          git config user.name "Alexander Ivanenko"
          git config user.email "sentimental1243@gmail.com"
          git add assets/neofetch.svg
          git diff --cached --quiet || git commit -m "Update neofetch card"
          git pull --rebase
          git push
